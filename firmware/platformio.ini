[env]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = bblanchon/ArduinoJson@^7.0.0

; Public build: no credentials inside. FW_BUILD / FW_VERSION come from tools/release.sh.
[env:public]

; Private seed build: copies Wi-Fi + web password into the board's flash once.
; Needs firmware/src/seed_config.h (gitignored, made by tools/make_seed.sh). Never publish this binary.
[env:seed]
build_flags = -DUSE_SEED -DFW_BUILD=1 -DFW_VERSION=seed
